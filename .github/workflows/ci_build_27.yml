name: CI - Build - Xcode 27

on:
    push:
        branches:
        - main

    pull_request:
        branches:
        - main

jobs:
  Build:
    permissions: write-all
    runs-on: xcode-27
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: 'true'

    - name: Build
      uses: "./.github/actions/ci_xcodebuild"
      with:
        xcode_version: "27.1"
        xcodebuild_destination: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
        xcodebuild_action: "build"
